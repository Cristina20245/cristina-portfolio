<!-- En el formulario, cambia esta línea: -->
<input type="hidden" name="_next" value="https://cristina-portfolio.netlify.app/?sent=true#contact">

<!-- Y actualiza el script completo a: -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Verificar si viene de un envío exitoso
    checkForSuccessMessage();

    // También verificar cuando cambia la URL (para redirecciones de FormSubmit)
    window.addEventListener('load', checkForSuccessMessage);
  });

  function checkForSuccessMessage() {
    const url = new URL(window.location.href);

    if (url.searchParams.get("sent") === "true") {
      // Pequeño delay para asegurar que la página está cargada
      setTimeout(() => {
        showSuccessMessage();
      }, 100);
    }
  }

  function showSuccessMessage() {
    // Verificar si ya existe una notificación
    if (document.querySelector('.email-success-notification')) return;

    const notification = document.createElement('div');
    notification.className = 'email-success-notification';
    notification.innerHTML = `
<div class="fixed top-4 right-4 bg-gray-900 text-white px-6 py-3 rounded-lg shadow-lg z-50 animate-fade-in border border-gray-700">
  <div class="flex items-center gap-2">
    <span>✅</span>
    <span>¡Message sent! Thank you 😊 I'll get back to you soon.</span>
  </div>
</div>
    `;
    document.body.appendChild(notification);

    // Remover después de 5 segundos
    setTimeout(() => {
      notification.remove();
    }, 5000);

    // Limpia la URL sin recargar
    const cleanUrl = window.location.pathname + window.location.hash;
    window.history.replaceState(null, "", cleanUrl);
  }
</script>

<style>
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in {
    animation: fade-in 0.5s ease-out;
  }
</style>
