<!-- Contact -->
<section id="contact" class="relative bg-mint py-16 px-6">
  <!-- Top decorative curve rotated 180° -->
  <div class="absolute top-0 left-0 w-full overflow-hidden leading-[0]">
    <svg class="relative block w-[calc(100%+1.3px)] h-[40px] rotate-180"
         xmlns="http://www.w3.org/2000/svg"
         preserveAspectRatio="none"
         viewBox="0 0 1200 120">
      <path d="M0,24 C200,56 400,24 600,48 C800,72 1000,24 1200,48 L1200,120 L0,120 Z" fill="#C2FFE1"/>
    </svg>
  </div>

  <div class="max-w-3xl mx-auto text-center">
    <h2 class="text-4xl font-body text-charcoal mb-8">
      Let's Chat!
    </h2>

    <p class="text-charcoal text-lg font-body mb-10">
      Got an idea for a project or just want to talk tech?<br>
      I'd love to hear from you - drop me a message below or connect on LinkedIn.
    </p>

    <!-- Direct links -->
    <div class="flex justify-center gap-6 mb-12">
      <a href="mailto:cristina.alvarez.f@gmail.com"
         class="flex items-center gap-2 bg-primary text-white px-5 py-2 rounded-full shadow-md hover:bg-cream hover:text-charcoal hover:border hover:border-charcoal transition-all duration-300 font-heading">
        ✉️ Email Me
      </a>
      <a href="https://www.linkedin.com/in/cristina-alvarez-f"
         target="_blank"
         class="flex items-center gap-2 bg-primary text-white px-5 py-2 rounded-full hover:bg-cream hover:text-charcoal hover:border hover:border-charcoal transition-all duration-300 font-heading">
        🔗 LinkedIn
      </a>
    </div>

    <!-- Contact form -->
    <form
      action="https://formsubmit.co/cristina.alvarez.f@gmail.com"
      method="POST"
      class="bg-white rounded-2xl shadow-lg p-8 text-left"
      id="contactForm"
    >
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_subject" value="New message from your portfolio!">
      <input type="hidden" name="_template" value="table">

      <!-- Redirect to HOME -->
      <input type="hidden" name="_next" value="https://cristina-portfolio.netlify.app/#home">

      <label class="block mb-4">
        <span class="text-charcoal font-medium font-heading">Your email</span>
        <input
          type="email"
          name="email"
          required
          class="mt-1 w-full p-3 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary font-body"
          placeholder="your.email@example.com"
        />
      </label>

      <label class="block mb-6">
        <span class="text-charcoal font-medium font-heading">What's on your mind?</span>
        <textarea
          name="message"
          rows="4"
          required
          class="mt-1 w-full p-3 rounded border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary font-body"
          placeholder="Hey Cristina, I'd love to talk about..."
        ></textarea>
      </label>

      <button
        type="submit"
        class="bg-primary text-white px-6 py-3 rounded-full shadow-md hover:bg-cream hover:text-charcoal hover:border hover:border-charcoal transition-all duration-300 block mx-auto max-w-xs font-heading"
      >
        Send Message
      </button>
    </form>
  </div>
</section>

<!-- Improved form submission handling -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Enhance form submission
    const contactForm = document.getElementById('contactForm');
    if (contactForm) {
      contactForm.addEventListener('submit', function() {
        // Change button text while sending
        const submitBtn = this.querySelector('button[type="submit"]');
        submitBtn.innerHTML = 'Sending...';
        submitBtn.disabled = true;
      });
    }
  });
</script>
