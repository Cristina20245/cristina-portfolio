<section class="bg-cream min-h-[60vh] flex flex-col justify-center items-center text-center px-6 py-12 relative">

  </p>

  <!-- Animated flip text -->
  <h1 class="text-4xl md:text-6xl font-heading text-charcoal mb-6">

          <div class="flip-line flex items-center justify-center">dreams into deploys 🚀</div>

      </span>
    </span>

  <!-- Bottom decorative curve -->
  <div class="absolute bottom-[-2px] left-0 w-full overflow-hidden leading-[0]">
    <svg class="relative block w-[calc(100%+1.3px)] h-[60px]"
